<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <header class="border-b border-slate-800 glass p-4 flex items-center justify-between">
        <h1 class="text-lg font-extrabold text-rose-500">🛡️ Vortex Admin Dashboard</h1>
        <div id="admin-user-info" class="text-sm font-semibold text-slate-400">กำลังตรวจสอบสิทธิ์...</div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="p-6 rounded-3xl glass border border-slate-800 shadow-xl">
                <h3 class="text-sm font-semibold text-slate-400 mb-1">รายงานความไม่เหมาะสม</h3>
                <p class="text-3xl font-extrabold text-rose-500" id="stat-reports">0</p>
            </div>
            <div class="p-6 rounded-3xl glass border border-slate-800 shadow-xl">
                <h3 class="text-sm font-semibold text-slate-400 mb-1">สมาชิกทั้งหมด</h3>
                <p class="text-3xl font-extrabold text-violet-500" id="stat-users">0</p>
            </div>
            <div class="p-6 rounded-3xl glass border border-slate-800 shadow-xl">
                <h3 class="text-sm font-semibold text-slate-400 mb-1">ข้อความทั้งหมด</h3>
                <p class="text-3xl font-extrabold text-emerald-500" id="stat-messages">0</p>
            </div>
        </div>

        <div class="p-6 rounded-3xl glass border border-slate-800 shadow-xl">
            <h2 class="text-xl font-bold mb-4">จัดการรายการรายงาน (Reports)</h2>
            <div id="reports-list" class="space-y-3">
                <p class="text-sm text-slate-500">กำลังโหลดข้อมูลรายงาน...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAuafJFSxf5MH2wG8UO5er14peRwT1jl8g",
            authDomain: "anonmsg-7fc77.firebaseapp.com",
            projectId: "anonmsg-7fc77",
            storageBucket: "anonmsg-7fc77.firebasestorage.app",
            messagingSenderId: "619051284089",
            appId: "1:619051284089:web:599084ffeeedf557de46a8",
            measurementId: "G-367T0PCVBJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                alert('กรุณาเข้าสู่ระบบก่อนใช้งาน Admin Dashboard');
                window.location.href = 'index.html';
                return;
            }
            try {
                const tokenResult = await user.getIdTokenResult(true);
                if (!tokenResult.claims.admin) {
                    alert('คุณไม่มีสิทธิ์ผู้ดูแลระบบ (Admin Only)');
                    window.location.href = 'index.html';
                    return;
                }
                document.getElementById('admin-user-info').textContent = user.email + ' (Admin)';
                loadAdminData();
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการตรวจสอบสิทธิ์: ' + err.message);
                window.location.href = 'index.html';
            }
        });

        async function loadAdminData() {
            const usersSnap = await getDocs(collection(db, 'users'));
            const msgsSnap = await getDocs(collection(db, 'messages'));
            const reportsSnap = await getDocs(collection(db, 'reports'));

            document.getElementById('stat-users').textContent = usersSnap.size;
            document.getElementById('stat-messages').textContent = msgsSnap.size;
            document.getElementById('stat-reports').textContent = reportsSnap.size;

            const container = document.getElementById('reports-list');
            if (reportsSnap.empty) {
                container.innerHTML = `<p class="text-sm text-slate-500">ไม่มีรายการรายงานในขณะนี้</p>`;
                return;
            }

            let html = '';
            reportsSnap.forEach(docSnap => {
                const r = docSnap.data();
                const id = docSnap.id;
                html += `
                    <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between">
                        <div>
                            <p class="text-sm font-bold text-rose-400">ประเภท: ${r.targetType} | เหตุผล: ${r.reason}</p>
                            <p class="text-xs text-slate-400 mt-1">Target ID: ${r.targetId}</p>
                        </div>
                        <button onclick="resolveReport('${id}')" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 transition">จัดการแล้ว</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.resolveReport = async function(reportId) {
            try {
                await deleteDoc(doc(db, 'reports', reportId));
                alert('ลบรายงานเรียบร้อยแล้ว');
                loadAdminData();
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            }
        };
    </script>
</body>
</html>
